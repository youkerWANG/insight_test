<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
/* ============================================================
   全局基础
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  color: rgba(0,0,0,.88);
  background: #f0f2f5;
  overflow: hidden;
}
a { color: #1668dc; text-decoration: none; cursor: pointer; }
a:hover { color: #4096ff; }
ul { list-style: none; }
button { font-family: inherit; }

:root {
  --primary: #1668dc;
  --primary-hover: #4096ff;
  --danger: #ff4d4f;
  --text: rgba(0,0,0,.88);
  --text-secondary: rgba(0,0,0,.45);
  --border: #f0f0f0;
  --sidebar-w: 180px;
}

/* ============================================================
   布局骨架
   ============================================================ */
.layout { display: flex; height: 100vh; }
.sidebar {
  width: var(--sidebar-w);
  background: #fff;
  border-right: 1px solid #f0f0f0;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  position: relative;
  z-index: 20;
  transition: width .2s;
}
.layout.collapsed .sidebar { width: 48px; }
.layout.collapsed .logo .logo-text,
.layout.collapsed .menu-item-title .mi-text, .layout.collapsed .menu-item-title .mi-arrow,
.layout.collapsed .sidebar-footer .sf-user span { display: none; }
.layout.collapsed .menu-item-title { padding: 0 16px; }
.layout.collapsed .submenu .menu-item-title { padding-left: 16px; }
.layout.collapsed .sidebar-footer { justify-content: center; }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.content { flex: 1; overflow-y: auto; overflow-x: hidden; background: #f0f2f5; padding: 12px 16px 24px; position: relative; }

/* ============================================================
   侧边栏
   ============================================================ */
.logo {
  height: 48px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 7px;
  flex-shrink: 0;
}
.logo svg { flex-shrink: 0; }
.logo-text { display: flex; align-items: center; min-width: 0; }
.logo-main { display: flex; align-items: baseline; gap: 3px; white-space: nowrap; line-height: 48px; }
.logo-cn { font-size: 16px; font-weight: 700; color: #0b3b8c; letter-spacing: .5px; }
.logo-ai { font-size: 13.5px; font-weight: 700; background: linear-gradient(90deg, #1668dc, #4096ff); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: .5px; }
.beta-sup { font-style: normal; font-size: 9px; font-weight: 600; color: #d48806; letter-spacing: 1px; margin-left: 1px; position: relative; top: -8px; }

.menu { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 8px; }
.menu::-webkit-scrollbar { width: 4px; }
.menu::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 2px; }

.menu-item { cursor: pointer; user-select: none; }
.menu-item-title {
  height: 40px;
  display: flex;
  align-items: center;
  padding: 0 12px 0 16px;
  gap: 8px;
  color: rgba(0,0,0,.78);
  font-size: 14px;
  transition: background .2s, color .2s;
}
.menu-item-title .mi-icon { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: #1668dc; }
.menu-item-title .mi-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu-item-title .mi-arrow { width: 10px; height: 10px; transition: transform .25s; color: rgba(0,0,0,.35); flex-shrink: 0; }
.menu-item.open > .menu-item-title .mi-arrow { transform: rotate(180deg); }
.menu-item-title:hover { background: #f5f8ff; color: #1668dc; }

/* 侧边栏选中态（叶子节点）：蓝底白字 */
.menu-leaf.active > .menu-item-title {
  background: #1a6de0;
  color: #fff;
}
.menu-leaf.active > .menu-item-title .mi-icon,
.menu-leaf.active > .menu-item-title .mi-arrow { color: #fff; }

.submenu { display: none; background: #fff; }
.menu-item.open > .submenu { display: block; }
.submenu .menu-item-title { padding-left: 40px; font-size: 14px; }
.submenu .submenu .menu-item-title { padding-left: 62px; }

.sidebar-footer {
  height: 44px;
  border-top: 1px solid #f0f0f0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px 0 14px;
  flex-shrink: 0;
}
.sidebar-footer .sf-user { display: flex; align-items: center; gap: 6px; color: #1668dc; font-size: 13px; cursor: pointer; }
.sidebar-footer .sf-user svg { color: #8c8c8c; flex-shrink: 0; }

.sidebar-footer .sf-collapse:hover { color: #1668dc; }

/* ============================================================
   顶栏
   ============================================================ */
.topbar {
  height: 40px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;

.topbar .tb-left { display: flex; align-items: center; }
.topbar .tb-right { display: flex; align-items: center; gap: 22px; color: #595959; }
.topbar .tb-right .tb-btn { cursor: pointer; display: inline-flex; align-items: center; color: #8c8c8c; }
.topbar .tb-right .tb-btn:hover { color: #1668dc; }
.topbar .tb-user { display: flex; align-items: center; gap: 5px; font-size: 13px; color: #595959; cursor: pointer; }
.topbar .tb-user svg { color: #8c8c8c; }

/* ============================================================

.card { background: #fff; border-radius: 6px; padding: 16px; margin-bottom: 12px; }
.card-title { font-size: 15px; font-weight: 600; color: rgba(0,0,0,.88); margin-bottom: 12px; }

.btn {

}
.btn:hover { border-color: #1668dc; color: #1668dc; }

.btn-link { border: none; background: none; color: #1668dc; padding: 0 6px; height: 26px; }
.btn-link:hover { color: #4096ff; }
.btn-link-danger { border: none; background: none; color: #ff4d4f; padding: 0 6px; height: 26px; }
.btn-link-danger:hover { color: #ff7875; }
.btn:disabled { color: #bfbfbf; border-color: #d9d9d9; cursor: not-allowed; background: #fff; }

.input, .select {

}

.select { padding-right: 24px; appearance: none; -webkit-appearance: none;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 1024 1024'%3E%3Cpath fill='%23bfbfbf' d='M884 256h-75c-5 0-9 2-13 6L512 666 208 262c-4-4-8-6-13-6h-75c-6 0-11 7-7 13l366 528c9 13 26 13 35 0L891 269c4-6 0-13-7-13z'/%3E%3C/svg%3E");
  background-repeat: no-repeat; background-position: right 8px center; }
.select:disabled { background-color: #f5f5f5; color: #bfbfbf; cursor: not-allowed; }

.filter-bar { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; padding: 4px 0 12px; }
.filter-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(0,0,0,.66); white-space: nowrap; }

.filter-more { color: rgba(0,0,0,.75); font-weight: 700; cursor: pointer; letter-spacing: 1px; padding: 0 4px; }

.tag { display: inline-block; padding: 1px 8px; border-radius: 3px; font-size: 12px; line-height: 20px; white-space: nowrap; }

.tag-medium { background: #fff1b8; color: #d48806; }
.tag-low    { background: #d6e4ff; color: #1d39c4; }

.tag-risk-mid  { background: #fff1b8; color: #d48806; }

.vpt-p0 { color: #ff4d4f; } .vpt-p1 { color: #fa8c16; } .vpt-p2 { color: #d4b106; } .vpt-p3 { color: #1890ff; } .vpt-p4 { color: #8c8c8c; }
.tag-status { background: #e6f4ff; color: #1668dc; }

.state-tabs { display: flex; align-items: center; gap: 28px; border-bottom: 1px solid #f0f0f0; padding: 6px 0 0; }
.state-tab { padding: 10px 2px; cursor: pointer; color: rgba(0,0,0,.65); font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; }
.state-tab:hover { color: #1668dc; }
.state-tab.active { color: #1668dc; border-bottom-color: #1668dc; font-weight: 500; }

.table-wrap { overflow-x: auto; margin-top: 10px; }

.icon-btn {

}

.pagination { display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding: 14px 0 4px; font-size: 13px; color: rgba(0,0,0,.65); }
.pagination .pg-item { min-width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #d9d9d9; border-radius: 4px; background: #fff; cursor: pointer; }

.select-bar { display: flex; align-items: center; gap: 16px; padding: 10px 0 2px; font-size: 13px; color: rgba(0,0,0,.65); }

/* 弹窗 */

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 40px; }
.form-item { display: flex; align-items: flex-start; gap: 8px; }
.form-item label { width: 96px; text-align: right; line-height: 28px; font-size: 13px; color: rgba(0,0,0,.66); flex-shrink: 0; white-space: nowrap; }
.form-item label .req { color: #ff4d4f; margin-right: 2px; }
.form-item .input, .form-item .select { flex: 1; width: 100%; }
.form-item.disabled .input, .form-item.disabled .select { background: #f5f5f5; color: #bfbfbf; cursor: not-allowed; }
.form-section { font-size: 14px; font-weight: 600; margin: 20px 0 12px; }
.form-item label.ta-label { line-height: 28px; }
.form-item textarea { flex: 1; border: 1px solid #d9d9d9; border-radius: 4px; padding: 6px 8px; font-size: 13px; font-family: inherit; resize: vertical; min-height: 70px; outline: none; }
.form-item textarea:focus { border-color: #1668dc; }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

.message { position: fixed; top: 50px; left: 50%; transform: translateX(-50%); background: #fff; border-radius: 6px; padding: 8px 16px; box-shadow: 0 4px 12px rgba(0,0,0,.15); z-index: 300; font-size: 13px; }
.message.success { color: #52c41a; }
.message.error { color: #ff4d4f; }

/* 仪表盘 */
.dash-top { display: flex; align-items: center; gap: 8px; padding: 6px 0 12px; color: rgba(0,0,0,.66); font-size: 13px; }
.stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.asset-card { display: flex; }

.vul-status-card { position: relative; }

.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

.trend-card .tc-title { color: rgba(0,0,0,.66); font-size: 13px; white-space: nowrap; }

.detail-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }

<script>
"use strict";
/* ================================================================
 * 鉴微 INSIGHT —— 前端复刻版（离线单文件）
 * - 已去除登录，直接进入仪表盘
 * - window.InsightAgentAPI 为预留的 Agent 接入层
 * ================================================================ */

/* ================================================================
 * 一、Agent API 预留层
 * ================================================================ */
const AgentBridge = (() => {
  const listeners = {};
  const handlers = {};
  /** agent 动作 -> 后端路由映射（远程模式生效；业务数据类动作保持本地） */
  const REMOTE_ROUTES = {
    generateJudgement: '/agent-api/judgement',
    generateFixAdvice: '/agent-api/fix-advice',
    adoptFixAdvice: '/agent-api/fix-advice/adopt',
    createTicket: '/agent-api/tickets',
  };
  // Vercel 同源部署版：前后端同域托管，远程模式 + 空 baseUrl 即同源直连。
  // 本地双击打开（file://）为本地模拟模式；要连本地后端可在大模型配置页切换远程 + http://127.0.0.1:8000。
  const config = { mode: 'local', baseUrl: '', headers: {} };
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    config.mode = 'remote';
    config.baseUrl = '';   // 同源：api/index.py 与本页面在同一个域名下
  }
  try {   // 运行模式持久化：演示时切换一次即可，刷新/重开不丢
    const saved = JSON.parse(localStorage.getItem('insight-agent-mode') || 'null');
    if (saved && saved.mode) { config.mode = saved.mode; config.baseUrl = saved.baseUrl || ''; config.headers = saved.headers || {}; }
  } catch (e) {}
  async function remoteCall(action, payload) {
    try {
      const resp = await fetch(config.baseUrl + REMOTE_ROUTES[action], {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, config.headers, adminHeaders()),
        body: JSON.stringify(payload),
      });
      const json = await resp.json();
      if (!json || typeof json.ok === 'undefined') return { ok: false, error: '响应不符合契约：缺少 ok 字段（见接入契约文档）' };
      return json;
    } catch (e) {
      return { ok: false, error: '远程 API 调用失败：' + e.message };
    }
  }
  function emit(event, payload) {
    (listeners[event] || []).slice().forEach(cb => { try { cb(payload); } catch (e) { console.error(e); } });
    (listeners['*'] || []).slice().forEach(cb => { try { cb({ event, payload }); } catch (e) { console.error(e); } });
  }
  return {
    /** 切换接入模式：configure({ mode:'local' }) 或 configure({ mode:'remote', baseUrl:'https://...', headers:{Authorization:'Bearer ...'} }) */
    configure(patch) {
      Object.assign(config, patch);
      try { localStorage.setItem('insight-agent-mode', JSON.stringify({ mode: config.mode, baseUrl: config.baseUrl, headers: config.headers })); } catch (e) {}
      return { ...config };
    },
    getConfig: () => ({ ...config }),
    async call(action, payload = {}) {
      emit('before:' + action, payload);
      let result;
      if (config.mode === 'remote' && REMOTE_ROUTES[action]) {
        result = await remoteCall(action, payload);   // 远程模式：agent 动作直接走真实后端
      } else if (handlers[action]) {
        result = await handlers[action](payload);     // 已被 agent / 真实 API 接管
      } else if (window.LocalActions && window.LocalActions[action]) {
        result = await window.LocalActions[action](payload);   // 本地模拟（测试数据）
      } else {
        result = { ok: false, error: '未知动作 ' + action };
      }
      emit('after:' + action, { payload, result });
      return result;
    },
    register(action, fn) { handlers[action] = fn; },
    unregister(action) { delete handlers[action]; },
    on(event, cb) { (listeners[event] = listeners[event] || []).push(cb); },
    off(event, cb) { const a = listeners[event] || []; const i = a.indexOf(cb); if (i > -1) a.splice(i, 1); },
    _routes: REMOTE_ROUTES,
  };
})();
window.InsightAgentAPI = AgentBridge;

/* 管理口令：公网部署时服务端设置 ADMIN_TOKEN 后，写操作与 LLM 配置需携带。
 * 仅存本机 localStorage（insight-admin-token），在「系统设置」页填写。 */
const ADMIN_TOKEN_KEY = 'insight-admin-token';
function getAdminToken() { try { return localStorage.getItem(ADMIN_TOKEN_KEY) || ''; } catch (e) { return ''; } }
function setAdminToken(t) { try { t ? localStorage.setItem(ADMIN_TOKEN_KEY, t) : localStorage.removeItem(ADMIN_TOKEN_KEY); } catch (e) {} }
function adminHeaders(extra) { const t = getAdminToken(); return Object.assign(t ? { 'X-Admin-Token': t } : {}, extra || {}); }

/* ================================================================
 * 二、常量与等级评定规则（与原版一致）
 * ================================================================ */
const LEVELS = ['超危', '高危', '中危', '低危', '信息'];
const LEVEL_CLS = { '超危': 'tag-super', '高危': 'tag-high', '中危': 'tag-medium', '低危': 'tag-low', '信息': 'tag-info' };
const LEVEL_PIE_COLOR = { '超危': '#f5222d', '高危': '#ffc069', '中危': '#fadb14', '低危': '#2f54eb', '信息': '#5cdbd3' };
const VPT_RANGE = [   // P0~P4 分值区间（VPT 配置页 / 等级映射与排序）
  { key: 'P0', cls: 'vpt-p0', label: '大于 80 小于等于 100' },
  { key: 'P1', cls: 'vpt-p1', label: '大于 74 小于等于 80' },

function _recordTicket(kind, id, ticketId, from) {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const ts = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  const list = kind === 'ip' ? DB.vulnsIp : DB.vulnsWeb;
  const v = list.find(x => String(x.id) === String(id));
  DB.tickets.unshift([ts, (v ? v.name : '漏洞ID ' + id) + '（ID ' + id + '）', 'tester', '提交修复建议', '进行中', v && v.planFix ? String(v.planFix).slice(0, 10) : '-', ticketId, '']);

}

      { label: '情报信息', from: '漏洞详情 · 情报信息字段', detail: '有无EXP ' + v.exp + ' · 有无POC ' + v.poc + ' · 补丁发布 ' + v.patch + ' · 在野利用 ' + v.wild },
      { label: '资产档案', from: asset ? '资产台账 · 资产IP=' + asset[0] : '漏洞详情 · 影响资产字段', detail: asset ? (asset[0] + '（' + asset[1] + '），责任人 ' + asset[7] + '，资产风险 ' + asset[6]) : (v.asset + '（' + v.assetName + '），责任人 ' + v.owner + '，未纳管') },
      ...(kbHits.length ? [{ label: '知识库命中', from: '漏洞知识库', detail: kbHits.map(k => k[0] + '（' + k[3] + '，' + k[1] + '）').join('；') }] : []),
      ...(sameClosed.length ? [{ label: '同源处置', from: '同 CVE 已修复记录', detail: sameClosed.length + ' 条：' + sameClosed.slice(0, 3).map(x => x.asset).join('、') }] : []),
    ];
    const unknowns = [];
    if (!asset) unknowns.push('资产 ' + v.asset + ' 未纳管，无法确认当前运行的组件与版本，无法判断升级是否需要停机。');
    else if (!DB.software.some(s => s[3] === v.asset)) unknowns.push('资产已纳管但软件台账未采集组件版本信息。');
    if (!kbHits.length) unknowns.push('知识库（demo 抽样）未命中同源条目，官方通告细节需人工补充。');
    const summary = [
      'VPT ' + c.score + ' 分（' + vptKeyOf(c.score) + '）的来源：' + (c.byRule ? '特殊评分规则命中直接赋值。' : '漏洞属性加权，等级「' + v.level + '」基础分 ' + (LEVEL_SCORE[v.level] ?? 0) + ' × 权重 100%。'),
      intelMissing ? '情报四项全部为空，分数未经情报维度校准——评分依据需要核实。' : '情报维度已有字段可校准评分。',
      '当前处置：' + v.status + '，负责人 ' + v.owner + ' / ' + v.coOwner + '，业务系统 ' + v.biz + '。' + (asset ? '资产已纳管，修复落实可追踪。' : '资产未纳管，落实无法追踪，建议先完成纳管。'),
      sameClosed.length ? '平台已有 ' + sameClosed.length + ' 条同 CVE 漏洞完成处置，可参考其处置方式。' : '',
    ].filter(Boolean).join('');
    return { ok: true, data: {
      vuln: { id: v.id, name: v.name, level: v.level, vpt: v.vpt, type: v.type, cve: v.cve, asset: v.asset, status: v.status },
      attribution: { score: c.score, key: vptKeyOf(c.score), byRule: c.byRule },
      summary, citations, unknowns,
      confidence: { level: asset ? 'high' : 'mid', text: asset ? '较高' : '中（资产未纳管，版本信息缺失）' },
    } };
  },
  /** 采纳建议：状态变更动作 —— 建工单 + 落审计日志（真实部署时 register() 接管为真实工单接口） */
  async adoptFixAdvice({ kind, id }) {

};

/** 依据 VPT 标准规则本地计算综合分与 P 级（复刻原版评级口径） */
function calcVptScore(vuln, cfg = DB.vptConfig) {
  const w = cfg.weights, vp = cfg.vulnProps, ap = cfg.assetProps, ip = cfg.intelProps;
  // 资产属性得分（demo 数据未建模完整资产属性，按默认值兜底）
  let assetScore = 0;
  let wsum = Number(ap.importance.weight) + Number(ap.internet.weight) + Number(ap.tags.weight);
  if (wsum > 0) {
    let s = 0;
    s += Number(ap.importance.weight) * Number(ap.importance.vals['一般资产'] || 0);
    s += Number(ap.internet.weight) * Number(ap.internet.vals['否'] || 0);
    s += Number(ap.tags.weight) * Number(ap.tags.defaultVal || 0);
    assetScore = s / (wsum || 1);
  }
  // 漏洞属性得分
  let vulnScore = 0; let vw = Number(vp.level.weight) + Number(vp.type.weight) + Number(vp.tags.weight) + Number(vp.kbTags.weight) + Number(vp.customTags.weight);
  if (vw > 0) {
    let s = 0;
    s += Number(vp.level.weight) * Number(LEVEL_SCORE[vuln.level] ?? 0);
    s += Number(vp.type.weight) * Number(vp.type.defaultVal || 0);
    s += Number(vp.tags.weight) * Number(vp.tags.defaultVal || 0);
    s += Number(vp.kbTags.weight) * Number(vp.kbTags.defaultVal || 0);
    s += Number(vp.customTags.weight) * Number(vp.customTags.defaultVal || 0);
    vulnScore = s / (vw || 1);
  }
  // 情报属性得分
  let intelScore = 0; let iw = Number(ip.exp.weight) + Number(ip.patch.weight) + Number(ip.wild.weight) + Number(ip.exploitWay.weight) + Number(ip.complexity.weight);
  if (iw > 0) {
    let s = 0;
    s += Number(ip.exp.weight) * Number(ip.exp.vals['无'] || 0);
    s += Number(ip.patch.weight) * Number(ip.patch.vals['无'] || 0);
    s += Number(ip.wild.weight) * Number(ip.wild.vals['无'] || 0);
    s += Number(ip.exploitWay.weight) * Number(ip.exploitWay.vals['远程利用'] || 0);
    s += Number(ip.complexity.weight) * Number(ip.complexity.vals['简单'] || 0);
    intelScore = s / (iw || 1);
  }
  const total = Number(w.asset) / 100 * assetScore + Number(w.vuln) / 100 * vulnScore + Number(w.intel) / 100 * intelScore;
  // 特殊评分规则命中（优先于常规计分）
  for (const rule of cfg.specialRules) {
    const hit = rule.conds.every(c => {
      const [f, , val] = c;
      if (f === '漏洞等级') return vuln.level === val;
      if (f === '是否外网资产') return val === '外网资产'; // demo 未建模，仅示意
      return false;
    });
    if (hit) return { score: Number(rule.score), byRule: true };
  }
  return { score: Math.round(total * 100) / 100, byRule: false };
}
function vptKeyOf(score) {
  if (score > 80) return 'P0';
  if (score > 74) return 'P1';
  if (score > 49) return 'P2';
  if (score > 0) return 'P3';
  return 'P4';
}

function renderMenu(activeRoute) {
  const findRoot = (items) => {
    for (const it of items) {
      if (it.route === activeRoute) return [it];
      if (it.children) {
        const sub = findRoot(it.children);
        if (sub && sub.length) return [it, ...sub];
      }
    }
    return null;
  };
  const path = findRoot(MENU) || [];
  const pathSet = new Set(path);

  const html = (items, level) => items.map(it => {
    if (it.children) {
      const open = pathSet.has(it) ? ' open' : '';
      const activeRoot = pathSet.has(it) && path[0] !== it ? '' : (path[0] === it && path.length > 1 ? ' active-root' : '');
      return `<div class="menu-item${open}${activeRoot}" data-menu-key="${esc(it.title)}">
        <div class="menu-item-title">
          <span class="mi-icon">${it.icon ? MENU_ICONS[it.icon] : ''}</span>
          <span class="mi-text">${esc(it.title)}</span>
          <svg class="mi-arrow" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </div>
        <div class="submenu">${html(it.children, level + 1)}</div>
      </div>`;
    }
    const active = it.route === activeRoute ? ' active' : '';
    return `<div class="menu-item menu-leaf${active}" data-route="${esc(it.route)}">
      <div class="menu-item-title">
        <span class="mi-icon"></span>
        <span class="mi-text">${esc(it.title)}</span>
      </div>
    </div>`;
  }).join('');
  $menu.innerHTML = html(MENU, 0);

  $menu.querySelectorAll('.menu-leaf').forEach(el => {
    el.addEventListener('click', () => { location.hash = el.dataset.route; });
  });
  $menu.querySelectorAll('.menu-item > .menu-item-title').forEach(titleEl => {
    const parent = titleEl.parentElement;
    if (parent.classList.contains('menu-leaf')) return;
    titleEl.addEventListener('click', (e) => {
      // 组节点点击：切换展开；若同时是本组路由父级，仍只展开收起
      if (parent.classList.contains('open') && !parent.dataset.openedOnce) {
        parent.dataset.openedOnce = '1';
        return; // 首次因 active 自动展开，点击视为误触切换 protection
      }
      parent.classList.toggle('open');
    });
  });
}

/* ---------- 仪表盘 ---------- */
function donutSvg(segments, size = 120, thickness = 14) {
  const cx = size / 2, r = (size - thickness) / 2 - 2;
  const C = 2 * Math.PI * r;
  let acc = 0, arcs = '';
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  segments.forEach(sg => {
    const frac = sg.value / total;
    if (frac <= 0) return;
    const dash = frac * C;
    // 分段过小时不做两端收缩，避免出现负 dasharray（会被渲染为整圆）
    const on = dash > 4 ? dash - 2 : dash;
    const off = dash > 4 ? C - dash + 2 : C - dash;
    arcs += `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${sg.color}" stroke-width="${thickness}"
      stroke-dasharray="${on} ${off}" stroke-dashoffset="${-acc * C + C / 4}" stroke-linecap="butt"/>`;
    acc += frac;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}</svg>`;
}
function pieSvg(segments, size = 130) {
  const cx = size / 2, r = size / 2 - 2;
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  let a0 = -Math.PI / 2, arcs = '';
  segments.forEach(sg => {
    const frac = sg.value / total;
    if (frac <= 0) return;
    const a1 = a0 + frac * 2 * Math.PI;
    const x0 = cx + r * Math.cos(a0), y0 = cx + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cx + r * Math.sin(a1);
    arcs += `<path d="M${cx} ${cx} L${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${frac > .5 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} z" fill="${sg.color}"/>`;
    a0 = a1;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}</svg>`;
}
function curveSvg(color = '#ff4d4f') {
  return `<svg width="100%" height="60" viewBox="0 0 220 60" preserveAspectRatio="none">
    <path d="M5 45 C 30 10, 55 8, 80 22 S 130 48, 155 38 S 200 18, 215 22" fill="none" stroke="${color}" stroke-width="1.6"/>
    <path d="M5 45 C 30 10, 55 8, 80 22 S 130 48, 155 38 S 200 18, 215 22 L215 58 L5 58 z" fill="${color}" opacity=".08"/>
  </svg>`;
}
function barChartSvg(items, width = 1080, height = 280) {
  const padL = 36, padB = 84, padT = 10;
  const maxV = 180;
  const plotH = height - padB - padT, plotW = width - padL - 8;
  const step = plotW / items.length;
  let gridLines = '', bars = '', labels = '', ticks = '';
  for (let i = 0; i <= 6; i++) {
    const y = padT + plotH - i * plotH / 6;
    gridLines += `<line x1="${padL}" y1="${y}" x2="${width - 8}" y2="${y}" stroke="#f0f0f0"/>`;
    ticks += `<text x="${padL - 6}" y="${y + 4}" font-size="10" fill="rgba(0,0,0,.45)" text-anchor="end">${maxV / 6 * i}</text>`;
  }
  items.forEach((it, i) => {
    const h = it[1] / maxV * plotH;
    const x = padL + i * step + step * .25;
    bars += `<rect x="${x.toFixed(1)}" y="${(padT + plotH - h).toFixed(1)}" width="${(step * .5).toFixed(1)}" height="${h.toFixed(1)}" fill="#1a6de0"/>`;
    labels += `<text x="${(padL + i * step + step * .5).toFixed(1)}" y="${height - padB + 12}" font-size="10" fill="rgba(0,0,0,.65)" transform="rotate(45 ${(padL + i * step + step * .5).toFixed(1)} ${height - padB + 12})" text-anchor="start">${esc(it[0])}</text>`;
  });
  return `<svg width="100%" viewBox="0 0 ${width} ${height}">${gridLines}${ticks}${bars}${labels}</svg>`;
}
function arrowUp() { return `<svg width="10" height="10" viewBox="0 0 10 10" style="vertical-align:-1px"><path d="M5 1l4 6H1z" fill="currentColor"/></svg>`; }

  const aijAll = document.getElementById('aij-all');
  if (aijAll) aijAll.addEventListener('click', () => {
    const listEl = document.getElementById('aij-list');
    const expanded = listEl.dataset.exp === '1';

    bindAijItems();
    aijAll.textContent = expanded ? '查看全部 ' + anomalies.length + ' 条 →' : '收起 ↑';
  });
}

/* ---------- 功能一：AI 研判摘要（详情页首卡，读取类自动执行） ---------- */
const JUDGE_STEPS = [
  { tool: 'getVuln', label: '读取漏洞上下文（等级 / VPT / 类型 / CVE）' },
  { tool: 'getVptAttribution', label: '计算 VPT 归因与特殊规则命中' },
  { tool: 'searchKnowledge', label: '检索知识库与情报库' },
  { tool: 'getDisposalRecords', label: '读取处置记录时间线' },
  { tool: 'organize', label: '组织语言生成研判摘要（逐条溯源）' },
];
async function loadJudgement(kind, v) {
  const host = document.getElementById('ai-judge-body');
  if (!host) return;
  host.innerHTML = `
    <div class="step-list" id="judge-steps">
      ${JUDGE_STEPS.map((s, i) => `<div class="step-row" id="judge-step-${i}"><span class="sp-ic">✓</span><span>${esc(s.label)}</span><span class="sp-note"></span></div>`).join('')}
    </div>
    <div id="judge-result"></div>`;
  for (let i = 0; i < JUDGE_STEPS.length; i++) {
    const el = document.getElementById('judge-step-' + i);
    el.className = 'step-row doing';
    let note = '';
    const t = JUDGE_STEPS[i].tool;
    if (t === 'getVuln') { const r = await AgentBridge.call('getVuln', { kind, id: v.id }); note = r.ok ? '已读取' : '读取失败'; }
    else if (t === 'getVptAttribution') { const r = await AgentBridge.call('getVptAttribution', { kind, id: v.id }); note = r.ok ? (r.data.score + ' 分（' + r.data.key + '）· 特殊规则' + (r.data.byRule ? '命中' : '未命中')) : ''; }
    else if (t === 'searchKnowledge') { const r = await AgentBridge.call('searchKnowledge', { kind, id: v.id }); note = r.ok ? '命中 ' + r.data.count + ' 条' : ''; }
    else if (t === 'getDisposalRecords') { const r = await AgentBridge.call('getDisposalRecords', { kind, id: v.id }); note = r.ok ? r.data.count + ' 条记录' : ''; }
    await new Promise(r => setTimeout(r, 240));
    el.className = 'step-row done';
    const nEl = el.querySelector('.sp-note'); if (nEl) nEl.textContent = note;
  }
  const res = await AgentBridge.call('generateJudgement', { kind, id: v.id });
  const resultEl = document.getElementById('judge-result');
  if (!res.ok) { resultEl.innerHTML = '<div class="unknown-note">研判失败：' + esc(res.error || '') + '</div>'; return; }
  const d = res.data;
  resultEl.innerHTML = `
    <div class="advice-section" style="margin-bottom:10px">
      <div class="advice-sec-title">研判摘要</div>
      <div class="advice-sec-body">${esc(d.summary)}</div>
    </div>
    <div class="advice-section" style="margin-bottom:10px">
      <div class="advice-sec-title">结论依据（${d.citations.length} 项）</div>
      <div class="advice-sec-body">
        ${d.citations.map(c => `<div class="kv-line" style="margin:2px 0"><span class="cite" title="${esc(c.from)}">※ ${esc(c.label)}</span><span class="v" style="color:rgba(0,0,0,.7)">${esc(c.detail)}</span></div>`).join('')}
      </div>
    </div>
    ${d.unknowns.length ? `<div class="unknown-note">※ ${d.unknowns.map(u => esc(u)).join('<br>※ ')}</div>` : ''}
    <div class="conf-band"><i class="conf-dot" style="background:${d.confidence.level === 'high' ? '#52c41a' : '#faad14'}"></i>置信度：<b>${esc(d.confidence.text)}</b>　|　依据 ${d.citations.length} 项 / 缺失 ${d.unknowns.length} 项　|　生成方式：${d.generatedBy === 'deepseek' ? 'DeepSeek 真实分析' : d.generatedBy ? '后端模板（LLM 未配置）' : '前端本地模拟'}</div>`;
  resultEl.querySelectorAll('.cite').forEach(c => c.addEventListener('click', () => toast(c.title, 'success')));
}

/* ---------- 编辑弹窗（含漏洞等级评定交互） ---------- */
function openVulEditModal(kind, v) {
  const disabled = c => `<div class="form-item disabled"><label>${c.label}：</label>${c.select

let lastAdvice = null, lastAdviceVuln = null;
async function runFixGeneration(kind, v, regen) {
  const steps = FIX_STEPS.map((_, i) => document.getElementById('fix-step-' + i));
  const resultEl = document.getElementById('fix-result');
  steps.forEach(s => { s.className = 'step-row'; });
  resultEl.innerHTML = '';
  ['fix-adopt', 'fix-copy', 'fix-regen'].forEach(id => { const b = document.getElementById(id); if (b) b.disabled = true; });
  // LUI 反馈：任务拆解步骤依次点亮，每步真实调用对应工具动作（agent 用工具取数）
  for (let i = 0; i < steps.length; i++) {
    steps[i].className = 'step-row doing';
    let note = '';
    const t = FIX_STEPS[i].tool;
    if (t === 'getVuln') { const r = await AgentBridge.call('getVuln', { kind, id: v.id }); note = r.ok ? '已读取' : '读取失败'; }
    else if (t === 'getVptAttribution') { const r = await AgentBridge.call('getVptAttribution', { kind, id: v.id }); note = r.ok ? (r.data.score + ' 分（' + r.data.key + '）· 特殊规则' + (r.data.byRule ? '命中' : '未命中')) : ''; }
    else if (t === 'searchKnowledge') { const r = await AgentBridge.call('searchKnowledge', { kind, id: v.id }); note = r.ok ? '命中 ' + r.data.count + ' 条' : ''; }
    else if (t === 'getAssetProfile') { const r = await AgentBridge.call('getAssetProfile', { kind, id: v.id }); note = r.ok ? (r.data.managed ? '已纳管' : '未纳管') : ''; }
    await new Promise(r => setTimeout(r, regen ? 320 : 240));
    steps[i].className = 'step-row done';
    const nEl = steps[i].querySelector('.sp-note'); if (nEl) nEl.textContent = note;
  }
  const res = await AgentBridge.call('generateFixAdvice', { kind, id: v.id });
  if (!res.ok) { resultEl.innerHTML = '<div class="unknown-note">生成失败：' + esc(res.error || '') + '</div>'; return; }

  ['fix-adopt', 'fix-copy', 'fix-regen'].forEach(id => { const b = document.getElementById(id); if (b) b.disabled = false; });
}

function remoteApi(method, path, body) {
  const cfg = AgentBridge.getConfig();
  return fetch(cfg.baseUrl + path, {
    method,
    headers: Object.assign({ 'Content-Type': 'application/json' }, adminHeaders()),
    body: body !== undefined ? JSON.stringify(body) : undefined,

        <div class="modal-footer"><button class="btn" id="tf-cancel">取消</button><button class="btn btn-primary" id="tf-save">保存</button></div>
      </div>
    </div>`;
    const close = () => { $modalRoot.innerHTML = ''; };
    ['tf-close', 'tf-cancel'].forEach(id => document.getElementById(id).addEventListener('click', close));
    document.getElementById('tf-mask').addEventListener('click', e => { if (e.target.id === 'tf-mask') close(); });
    document.getElementById('tf-save').addEventListener('click', async () => {
      const name = document.getElementById('tf-name').value || '未命名工单';
      const exec = document.getElementById('tf-exec').value || 'tester';
      const step = document.getElementById('tf-step').value || '-';
      const status = document.getElementById('tf-status').value;
      const plan = document.getElementById('tf-plan').value || '-';
      if (AgentBridge.getConfig().mode === 'remote') {
        if (mode === 'create') {
          const resp = await remoteApi('POST', '/api/tickets', { vulnName: name, executor: exec, step, status, planTime: plan, from: 'manual' });
          if (!resp.ok) { toast(resp.error || '创建失败', 'error'); return; }
        } else {
          const resp = await remoteApi('PATCH', '/api/tickets/' + encodeURIComponent(tid), { vulnName: name, executor: exec, step, status, planTime: plan });
          if (!resp.ok) { toast(resp.error || '保存失败', 'error'); return; }
        }
      } else {
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const ts = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
        if (mode === 'create') {
          const newId = 'MOCK-' + Date.now().toString().slice(-6);
          DB.tickets.unshift([ts, name, exec, step, status, plan, newId, '']);
          DB.logs.unshift([ts, 'tester', 'leader', '127.0.0.1', '工单中心：手动新建工单（' + newId + '）', '成功']);
        } else {
          const i = DB.tickets.findIndex(x => x[6] === tid);
          if (i > -1) DB.tickets[i] = [DB.tickets[i][0], name, exec, step, status, plan, tid, ''];
          DB.logs.unshift([ts, 'tester', 'leader', '127.0.0.1', '工单中心：编辑工单（' + tid + '）', '成功']);
        }
      }
      close();
      toast(mode === 'create' ? '工单已创建' : '工单已保存');
      renderOrders(page, 0);
    });
  });
}
function confirmDeleteTicket(tid, page) {
  $modalRoot.innerHTML = `
  <div class="modal-mask" id="td-mask">
    <div class="modal" style="width:420px">
      <span class="modal-close" id="td-close">×</span>
      <div class="modal-title">删除工单</div>

      <div class="modal-footer"><button class="btn" id="td-cancel">取消</button><button class="btn btn-primary" id="td-ok" style="background:#ff4d4f;border-color:#ff4d4f">删除</button></div>
    </div>
  </div>`;
  const close = () => { $modalRoot.innerHTML = ''; };
  ['td-close', 'td-cancel'].forEach(id => document.getElementById(id).addEventListener('click', close));
  document.getElementById('td-ok').addEventListener('click', async () => {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const ts = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    if (AgentBridge.getConfig().mode === 'remote') {
      const resp = await remoteApi('DELETE', '/api/tickets/' + encodeURIComponent(tid));
      if (!resp.ok) { toast(resp.error || '删除失败', 'error'); return; }
    } else {
      const i = DB.tickets.findIndex(x => x[6] === tid);
      if (i > -1) DB.tickets.splice(i, 1);
      DB.logs.unshift([ts, 'tester', 'leader', '127.0.0.1', '工单中心：删除工单（' + tid + '）', '成功']);
    }
    close();
    toast('工单已删除');
    renderOrders(page, 0);
  });
}

function renderListPage(cfgKey) {
  const cfg = LIST_CONFIGS[cfgKey];
  if (!cfg) { renderSimplePage('页面', ''); return; }
  const data = cfg.key ? DB[cfg.key] : [];
  const hasData = data && data.length;
  const rowsHtml = hasData ? data.map(r => {
    const cells = cfg.cols.map((c, i) => {
      if (c === '操作') {
        const acts = cfg.actions || ['eye', 'edit', 'trash'];
        return `<td><span class="ops">${acts.map(a => `<button class="icon-btn${a === 'trash' ? ' danger' : ''}" data-act="${a}" title="${a}">${ICONS[a]}</button>`).join('')}</span></td>`;
      }
      const val = r[i] ?? '';
      if (cfg.riskCol === i) return `<td>${riskTag(val)}</td>`;
      if (cfg.levelCol === i) return `<td>${levelTag(val)}</td>`;
      if (cfg.tagCol === i) return `<td><span class="chip">${esc(val)}</span></td>`;
      const cls = (cfg.links || []).includes(i) ? ' class="cell-link"' : '';
      return `<td${cls}>${esc(val)}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('') : `<tr><td colspan="${cfg.cols.length}"><div class="empty">

/* ================================================================

    </div>
    ${tab === 'std' ? `

        ${pct('资产属性(占比)', c.weights.asset, true)}
        ${pct('漏洞属性(占比)', c.weights.vuln, true)}
        ${pct('情报属性(占比)', c.weights.intel, true)}
        <div class="vpt-section-title">资产属性</div>
        ${pct('是否外网资产', c.assetProps.internet.weight, true)}
        <div class="score-row"><span class="sr-label"></span>
          <span class="sr-sub">是</span><input class="input mini-input" value="${c.assetProps.internet.vals['是']}" disabled>
          <span class="sr-sub">否</span><input class="input mini-input" value="${c.assetProps.internet.vals['否']}" disabled></div>
        ${pct('资产重要性', c.assetProps.importance.weight, true)}
        <div class="score-row"><span class="sr-label"></span>
          <span class="sr-sub">核心资产</span><input class="input mini-input" value="${c.assetProps.importance.vals['核心资产']}" disabled>
          <span class="sr-sub">重要资产</span><input class="input mini-input" value="${c.assetProps.importance.vals['重要资产']}" disabled>
          <span class="sr-sub">一般资产</span><input class="input mini-input" value="${c.assetProps.importance.vals['一般资产']}" disabled></div>
        ${pct('资产标签', c.assetProps.tags.weight, true)}
        <div class="score-row"><span class="sr-label"></span><span class="sr-sub">标签默认分值</span><input class="input mini-input" value="${c.assetProps.tags.defaultVal}" disabled></div>
        <div class="vpt-section-title">漏洞属性</div>

          <span class="sr-sub">低危</span><input class="input mini-input" value="${c.vulnProps.level.vals['低危']}" disabled>
          <span class="sr-sub">默认</span><input class="input mini-input" value="${c.vulnProps.level.vals['默认']}" disabled></div>

        <div class="score-row"><span class="sr-label"></span><span class="sr-sub">自定义标签默认分值</span><input class="input mini-input" value="${c.vulnProps.customTags.defaultVal}" disabled></div>
        <div class="vpt-section-title">情报属性</div>
        ${pct('有无 EXP', c.intelProps.exp.weight, true)}

        ${c.specialRules.map((r, i) => `<div class="rule-card">

      </div>
      <div class="vpt-note">
        <h4>一、功能配置说明</h4>
        <h4 style="font-weight:600">计分规则配置</h4>
        <p>在系统中，您可自定义配置以下三类属性的权重分值，用于计算VPT综合评分：</p>
        <ul>
          <li>资产属性：如是否外网资产、资产重要性等。</li>
          <li>漏洞属性：如漏洞严重等级、漏洞类型等。</li>

        <p>每项属性可设置具体分值及对应权重，系统将根据权重进行加权计算。</p>

        <p>支持通过条件匹配方式，为特定漏洞设定直接赋值的VPT分值。</p>

        <h4 style="font-weight:600">VPT等级配置</h4>

        <h4 style="font-weight:600">加权排序规则配置</h4>

        <div class="score-row"><b style="color:#ff4d4f">P0</b>：超危风险</div><div class="text-secondary" style="margin:-8px 0 8px">${esc(VPT_LEVEL_DESC.P0.desc)}</div>

        <div class="score-row"><b style="color:#d4b106">P2</b>：中危风险</div><div class="text-secondary" style="margin:-8px 0 8px">${esc(VPT_LEVEL_DESC.P2.desc)}</div>
        <div class="score-row"><b style="color:#1890ff">P3</b>：低危风险</div><div class="text-secondary" style="margin:-8px 0 8px">${esc(VPT_LEVEL_DESC.P3.desc)}</div>
        <div class="score-row"><b style="color:#8c8c8c">P4</b>：信息风险</div><div class="text-secondary" style="margin:-8px 0 8px">${esc(VPT_LEVEL_DESC.P4.desc)}</div>
      </div>
    </div>`}
  </div>`;
  document.getElementById('vpt-tab-std').addEventListener('click', () => renderVptPage('std'));

  document.getElementById('vpt-edit').addEventListener('click', () => {
    window.__vptEdit = !window.__vptEdit;
    if (window.__vptEdit) toast('编辑模式（演示：所有输入框可编辑，保存走 AgentBridge）');

  });
  document.getElementById('vpt-reset').addEventListener('click', () => { toast('已恢复默认 VPT 配置（演示）'); });
  const restore = document.getElementById('vpt-restore');
  if (restore) restore.addEventListener('click', () => toast('已恢复 VPT 默认优先级（演示）'));
}

/* ================================================================

renderMenu('#/dashboard');
router();
// 远程模式下，采纳/建工单成功后把工单镜像进前端工单中心（本地模式由 LocalActions._recordTicket 直接写入，此处按模式判重）
function _mirrorTicket(payload, result) {
  if (AgentBridge.getConfig().mode !== 'remote' || !result || !result.ok) return;
  const id = payload.id ?? payload.vulnId;
  const kind = payload.kind || 'ip';
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const ts = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  const list = kind === 'ip' ? DB.vulnsIp : DB.vulnsWeb;
  const v = list.find(x => String(x.id) === String(id));
  DB.tickets.unshift([ts, (v ? v.name : '漏洞ID ' + id) + '（ID ' + id + '）', 'tester', '提交修复建议', '进行中', v && v.planFix ? String(v.planFix).slice(0, 10) : '-', (result.data && result.data.ticketId) || '-', '']);
}
AgentBridge.on('after:adoptFixAdvice', ({ payload, result }) => _mirrorTicket(payload, result));
AgentBridge.on('after:createTicket', ({ payload, result }) => _mirrorTicket(payload, result));
